name: Build Android APK and AAB (Play Store & Amazon)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK and Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Setup Platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Prepare Android Keystores and Environment
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'alifpixelcrypt2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'alifpixelcrypt2026' }}
        run: |
          # 1. Prepare Debug Keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Prepare Production Release Keystore (Required by Amazon & Google Play)
          if [ -f my-upload-key.jks.base64 ]; then
            base64 -d my-upload-key.jks.base64 > my-upload-key.jks
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Alif Pixel Crypt, OU=Mobile, O=Alif Studio, L=Dhaka, ST=Dhaka, C=BD"
            base64 my-upload-key.jks > my-upload-key.jks.base64
          fi

          # 3. Prepare Environment
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
          touch .env
          chmod +x gradlew

      - name: Build Release and Debug APKs & Bundles
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'alifpixelcrypt2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'alifpixelcrypt2026' }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace

      - name: Upload Release APK (For Amazon Appstore)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Alif-Pixel-Crypt-RELEASE-APK (For Amazon Appstore)
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB (For Google Play / Amazon Appstore)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Alif-Pixel-Crypt-RELEASE-AAB (For Google Play)
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload Debug APK (For Local Device Testing Only)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Alif-Pixel-Crypt-Debug-APK (For Testing Only)
          path: app/build/outputs/apk/debug/*.apk
