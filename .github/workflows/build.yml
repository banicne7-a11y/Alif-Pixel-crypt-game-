name: Build Android APK and AAB (Play Store & Amazon)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK & AAB
        run: |
          chmod +x gradlew || true
          gradle :app:assembleDebug :app:bundleDebug

      - name: Upload APK for Amazon Appstore / Testing
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB for Google Play Store / Amazon Appstore
        uses: actions/upload-artifact@v4
        with:
          name: App-Bundle-AAB
          path: app/build/outputs/bundle/debug/*.aab
